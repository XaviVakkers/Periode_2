<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <section class="tamagotchi-container">
        <h1>Tamagotchi</h1>
        <section class="status">
            <p id="hungerLabel">Honger: 100</p>
            <div class="status-bar">
                <div id="hungerBar" class="hunger-bar"></div>
            </div>

            <p id="energyLabel">Energie: 100</p>
            <div class="status-bar">
                <div id="energyBar" class="energy-bar"></div>
            </div>

            <p id="happinessLabel">Geluk: 100</p>
            <div class="status-bar">
                <div id="happinessBar" class="happiness-bar"></div>
            </div>

            <p id="tamagotchistatus"></p>

            <div class="button-container">
                <button id="feedbutton">Voeden</button>
                <button id="sleepbutton">Slapen</button>
                <button id="playbutton">Spelen</button>
            </div>
        </section>
</body>

</html>
